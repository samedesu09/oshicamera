<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Neon AR Camera - Pro Studio</title>
<meta name="theme-color" content="#060309">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100vw; height: 100dvh; overflow: hidden;
    background-color: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    position: fixed; top: 0; left: 0;
  }

  /* 背景レイヤー */
  #bg-wrapper {
    position: absolute; top: 0; left: 0; width: 100vw; height: 100dvh;
    z-index: 1; overflow: hidden;
  }
  #camera-preview, #bg-image-preview {
    position: absolute; top: 50%; left: 50%;
    width: 100vw; height: 100dvh;
    object-fit: cover;
    transform: translate(-50%, -50%);
    transform-origin: center center;
  }
  #bg-image-preview { display: none; }
  #bg-color-preview {
    position: absolute; top: 0; left: 0; width: 100vw; height: 100dvh;
    background-color: #00ff00; display: none;
  }

  /* ドラッグ検知用レイヤー */
  #touch-layer {
    position: absolute; top: 0; left: 0; width: 100vw; height: 100dvh;
    z-index: 10; touch-action: none; cursor: grab;
  }
  #touch-layer:active { cursor: grabbing; }

  /* 推し画像コンテナ */
  #overlay-container {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    display: none; z-index: 5; pointer-events: none;
  }

  /* ★影レイヤー (Canvasで作った純黒の画像をセットする) */
  #floor-shadow-img, #wall-shadow-img {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; display: none;
  }
  #floor-shadow-img { transform-origin: bottom center; }
  #wall-shadow-img { transform-origin: center center; top: 0; }
  
  /* メイン画像ラッパー */
  .main-img-wrapper {
    position: relative; width: 100%; height: 100%;
    overflow: hidden; pointer-events: none; z-index: 2;
    transform: translateZ(0); 
    isolation: isolate;
  }
  #main-overlay-img {
    position: relative; width: 100%; height: 100%; display: block;
    pointer-events: none;
  }

  /* ライティング用グラデーション */
  #lighting-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; mix-blend-mode: hard-light; opacity: 0;
    transition: opacity 0.2s;
  }

  /* 背景用環境光グラデーション */
  #bg-lighting-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; mix-blend-mode: overlay; opacity: 0;
    transition: opacity 0.2s; z-index: 2;
  }

  /* 下部コントロールバー */
  .bottom-bar {
    position: absolute; bottom: calc(env(safe-area-inset-bottom, 15px) + 15px);
    left: 0; width: 100vw; height: 80px;
    z-index: 20; display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; pointer-events: none;
  }

  /* シャッターボタン */
  .shutter-btn-wrapper {
    position: absolute; left: 50%; transform: translateX(-50%);
    pointer-events: auto;
  }
  .shutter-btn {
    width: 68px; height: 68px; border-radius: 50%;
    background: rgba(0, 230, 255, 0.2); border: 3px solid #00e6ff;
    box-shadow: 0 0 15px rgba(0, 230, 255, 0.5), inset 0 0 10px rgba(0, 230, 255, 0.3);
    cursor: pointer; display: flex; justify-content: center; align-items: center;
    transition: 0.1s; outline: none;
  }
  .shutter-btn:active { background: #00e6ff; box-shadow: 0 0 25px #00e6ff; transform: scale(0.92); }
  .shutter-inner {
    width: 52px; height: 52px; border-radius: 50%; background: #fff;
    box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
  }
  .shutter-btn:active .shutter-inner { background: #000; }

  /* 右下メニューボタン */
  .menu-toggle-btn {
    position: absolute; right: 24px; pointer-events: auto;
    width: 48px; height: 48px; border-radius: 12px;
    background: rgba(12, 8, 16, 0.65); backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.2); color: #fff;
    font-size: 1.4rem; cursor: pointer; transition: 0.2s; outline: none;
    display: flex; justify-content: center; align-items: center;
  }
  .menu-toggle-btn:active { transform: scale(0.9); }

  /* 左下スマート調整パネル */
  .quick-adjust-panel {
    position: absolute; left: 16px; width: calc(50% - 55px);
    display: flex; flex-direction: column; gap: 4px; pointer-events: auto;
    background: rgba(12, 8, 16, 0.7); backdrop-filter: blur(10px);
    border: 1px solid rgba(0, 230, 255, 0.3); border-radius: 12px;
    padding: 8px 12px; opacity: 0; pointer-events: none; transition: 0.25s ease;
  }
  .quick-adjust-panel.is-active { opacity: 1; pointer-events: auto; }
  .quick-label-row { display: flex; justify-content: space-between; align-items: center; }
  .quick-label { font-size: 0.6rem; color: #00e6ff; font-weight: bold; letter-spacing: 0.05em; }
  .quick-val { font-size: 0.6rem; color: #fff; font-family: monospace; }

  /* 左下ジョイスティック */
  .quick-joystick-wrap {
    position: absolute; left: 16px; bottom: 0px; width: 85px; height: 85px;
    border-radius: 50%; background: rgba(12, 8, 16, 0.75); backdrop-filter: blur(8px);
    border: 2px solid rgba(0, 230, 255, 0.4); display: none; justify-content: center; align-items: center;
    pointer-events: auto; box-shadow: 0 0 15px rgba(0,0,0,0.6);
  }
  .quick-joystick-wrap.is-active { display: flex; }
  .quick-joystick-wrap.pink-theme { border-color: rgba(255, 42, 109, 0.5); }
  .quick-joystick-wrap.yellow-theme { border-color: rgba(255, 215, 0, 0.6); box-shadow: 0 0 15px rgba(255, 215, 0, 0.2); }
  .quick-joystick-wrap.purple-theme { border-color: rgba(170, 0, 255, 0.6); box-shadow: 0 0 15px rgba(170, 0, 255, 0.3); }
  
  .quick-joystick-knob {
    width: 28px; height: 28px; border-radius: 50%;
    background: #00e6ff; box-shadow: 0 0 10px #00e6ff; position: absolute;
  }
  .quick-joystick-knob.pink-theme { background: #ff2a6d; box-shadow: 0 0 10px #ff2a6d; }
  .quick-joystick-knob.yellow-theme { background: #ffd700; box-shadow: 0 0 12px #ffd700; }
  .quick-joystick-knob.purple-theme { background: #aa00ff; box-shadow: 0 0 15px #aa00ff; }

  /* スライダー */
  input[type="range"] { appearance: none; width: 100%; height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px; outline: none; margin: 4px 0; }
  input[type="range"]::-webkit-slider-thumb {
    appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: #00e6ff; box-shadow: 0 0 8px rgba(0, 230, 255, 0.8); cursor: pointer;
  }

  /* サイドパネル */
  .side-panel {
    position: absolute; top: 0; right: 0; width: 290px; height: 100dvh;
    background: rgba(12, 8, 16, 0.92); backdrop-filter: blur(20px);
    border-left: 1px solid rgba(255, 255, 255, 0.15); z-index: 100;
    transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    display: flex; flex-direction: column; padding: 20px 16px; gap: 12px; overflow-y: auto;
  }
  .side-panel.is-open { transform: translateX(0); }
  
  .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
  .panel-title { font-size: 0.85rem; font-weight: bold; letter-spacing: 0.1em; color: #fff; }
  .close-btn { background: none; border: none; color: #aaa; font-size: 1.4rem; cursor: pointer; padding: 0 8px; }

  .menu-section-title { font-size: 0.65rem; color: #8a8190; letter-spacing: 0.05em; font-weight: bold; margin-top: 6px; }
  .menu-item-btn {
    width: 100%; padding: 10px 12px; border-radius: 8px; background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1); color: #fff; font-size: 0.75rem; text-align: left;
    cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.15s;
  }
  .menu-item-btn:active { background: rgba(0, 230, 255, 0.2); border-color: #00e6ff; color: #00e6ff; }
  .menu-item-btn span { font-family: monospace; font-size: 0.7rem; color: #00e6ff; }
  .menu-item-btn.pink-item:active { background: rgba(255, 42, 109, 0.2); border-color: #ff2a6d; color: #ff758c; }
  .menu-item-btn.pink-item span { color: #ff758c; }
  .menu-item-btn.yellow-item:active { background: rgba(255, 215, 0, 0.2); border-color: #ffd700; color: #ffd700; }
  .menu-item-btn.yellow-item span { color: #ffd700; }
  .menu-item-btn.purple-item { border-color: rgba(170, 0, 255, 0.4); background: rgba(170, 0, 255, 0.1); }
  .menu-item-btn.purple-item:active { background: rgba(170, 0, 255, 0.3); border-color: #aa00ff; color: #d580ff; }
  .menu-item-btn.purple-item span { color: #d580ff; }

  .btn-action {
    padding: 11px; border-radius: 8px; font-size: 0.75rem; font-weight: bold; cursor: pointer;
    width: 100%; text-align: center; border: none; outline: none;
  }
  .btn-upload { background: rgba(255, 42, 109, 0.15); border: 1px dashed #ff2a6d; color: #ff758c; }
  .btn-bg-select { background: rgba(0, 230, 255, 0.15); border: 1px dashed #00e6ff; color: #00e6ff; margin-top: 4px; }

  .toggle-row { display: flex; gap: 8px; }
  .toggle-btn {
    flex: 1; padding: 8px 0; background: rgba(255,255,255,0.05); border: 1px solid transparent;
    color: #888; font-size: 0.75rem; border-radius: 6px; cursor: pointer; font-weight: bold;
  }
  .toggle-btn.active.blue { background: rgba(0, 230, 255, 0.2); border-color: #00e6ff; color: #fff; }
  .toggle-btn.active.pink { background: rgba(255, 42, 109, 0.2); border-color: #ff2a6d; color: #fff; }
  .toggle-btn.active.yellow { background: rgba(255, 215, 0, 0.2); border-color: #ffd700; color: #ffd700; }

  /* タブUI */
  .tab-container {
    display: flex; background: rgba(0,0,0,0.5); border-radius: 8px; padding: 4px; margin-bottom: 8px;
  }
  .tab-btn {
    flex: 1; padding: 10px 0; font-size: 0.8rem; font-weight: bold; text-align: center;
    color: #888; background: transparent; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s;
  }
  .tab-btn.active { background: rgba(0, 230, 255, 0.25); color: #fff; box-shadow: 0 0 10px rgba(0,230,255,0.3); }

  .tab-content { display: none; flex-direction: column; gap: 12px; }
  .tab-content.is-active { display: flex; }

  #flash {
    position: absolute; top: 0; left: 0; width: 100vw; height: 100dvh;
    background: #fff; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.1s ease-out;
  }
  #capture-canvas { display: none; }
</style>
</head>
<body>

<div id="bg-wrapper">
  <video id="camera-preview" autoplay playsinline></video>
  <img id="bg-image-preview" src="" alt="bg">
  <div id="bg-color-preview"></div>
  <div id="bg-lighting-overlay"></div>
</div>

<div id="touch-layer"></div>

<div id="overlay-container">
  <!-- 影専用の黒シルエット画像 -->
  <img id="floor-shadow-img" src="" alt="floor-shadow">
  <img id="wall-shadow-img" src="" alt="wall-shadow">
  
  <div class="main-img-wrapper" id="main-wrapper">
    <img id="main-overlay-img" src="" alt="overlay">
    <div id="lighting-overlay"></div>
  </div>
</div>

<div id="flash"></div>

<input type="file" id="image-loader" accept="image/png, image/jpeg, image/gif" style="display: none;">
<input type="file" id="bg-loader" accept="image/png, image/jpeg, image/webp" style="display: none;">
<input type="color" id="color-picker" style="display: none;" value="#00ff00">

<div class="bottom-bar">
  <div class="quick-adjust-panel" id="quick-panel">
    <div class="quick-label-row">
      <span class="quick-label" id="quick-label-name">SIZE</span>
      <span class="quick-val" id="quick-val-text">100%</span>
    </div>
    <input type="range" id="quick-slider" min="10" max="250" value="100">
  </div>

  <div class="quick-joystick-wrap" id="quick-joy">
    <div class="quick-joystick-knob" id="quick-joy-knob"></div>
  </div>

  <div class="shutter-btn-wrapper">
    <button class="shutter-btn" onclick="takePhoto()"><div class="shutter-inner"></div></button>
  </div>

  <button class="menu-toggle-btn" onclick="toggleMenu()">⚙️</button>
</div>

<div class="side-panel" id="side-menu">
  <div class="panel-header">
    <div class="panel-title">STUDIO CONTROLS</div>
    <button class="close-btn" onclick="toggleMenu()">×</button>
  </div>

  <div class="menu-section-title">BACKGROUND MODE (背景)</div>
  <div class="toggle-row">
    <button class="toggle-btn blue active" id="btn-bg-cam" onclick="setBgMode('camera')">📷 カメラ</button>
    <button class="toggle-btn blue" id="btn-bg-img" onclick="setBgMode('image')">🖼️ 画像</button>
    <button class="toggle-btn blue" id="btn-bg-col" onclick="setBgMode('color')">🎨 単色</button>
  </div>
  <button class="btn-action btn-bg-select" id="btn-choose-bg" style="display: none;" onclick="document.getElementById('bg-loader').click()">📁 背景写真を選択</button>
  <button class="btn-action btn-bg-select" id="btn-choose-col" style="display: none;" onclick="document.getElementById('color-picker').click()">🎨 背景カラーを変更</button>
  
  <hr style="border:0; border-top:1px dashed rgba(255,255,255,0.15); margin: 6px 0;">

  <button class="btn-action btn-upload" onclick="document.getElementById('image-loader').click()">＋ 推しを配置する</button>

  <div id="studio-controls" style="display: none; flex-direction: column; gap: 12px; margin-top: 10px;">
    
    <div class="tab-container">
      <button class="tab-btn active" id="tab-btn-oshi" onclick="switchTab('oshi')">✨ 推し調整</button>
      <button class="tab-btn" id="tab-btn-bg" onclick="switchTab('bg')">🌆 背景調整</button>
    </div>

    <!-- 推し調整タブ -->
    <div class="tab-content is-active" id="tab-content-oshi">
      <div class="menu-section-title">IMAGE (ベース画像)</div>
      <button class="menu-item-btn" onclick="selectControl('size')">SIZE (大きさ)<span id="badge-size">100%</span></button>
      <button class="menu-item-btn" onclick="selectControl('rot')">ANGLE (回転)<span id="badge-rot">0°</span></button>
      <button class="menu-item-btn" onclick="selectControl('bright')">BRIGHT (ベースの明るさ)<span id="badge-bright">100%</span></button>

      <div class="menu-section-title" style="color: #ffd700;">LIGHTING (スポットライト)</div>
      <div class="toggle-row">
        <button class="toggle-btn yellow" id="btn-light-on" onclick="setLighting(true)">ON</button>
        <button class="toggle-btn yellow active" id="btn-light-off" onclick="setLighting(false)">OFF</button>
      </div>
      <button class="menu-item-btn yellow-item" onclick="selectControl('ljoy')">DIRECTION & POWER<span>🕹️</span></button>
      <button class="menu-item-btn yellow-item" onclick="selectControl('light-soft')">SOFTNESS (ボカシ)<span id="badge-light-soft">50%</span></button>

      <div class="menu-section-title">FLOOR SHADOW (床影)</div>
      <div class="toggle-row">
        <button class="toggle-btn pink" id="btn-fshadow-on" onclick="setFloorShadow(true)">ON</button>
        <button class="toggle-btn pink active" id="btn-fshadow-off" onclick="setFloorShadow(false)">OFF</button>
      </div>
      <button class="menu-item-btn pink-item" onclick="selectControl('fjoy')">DIRECTION & LENGTH<span>🕹️</span></button>
      <button class="menu-item-btn pink-item" onclick="selectControl('fsh-blur')">BLUR (ぼかし)<span id="badge-fsh-blur">5px</span></button>
      <button class="menu-item-btn pink-item" onclick="selectControl('fsh-op')">OPACITY (濃さ)<span id="badge-fsh-op">60%</span></button>

      <div class="menu-section-title">WALL SHADOW (壁影)</div>
      <div class="toggle-row">
        <button class="toggle-btn blue" id="btn-wshadow-on" onclick="setWallShadow(true)">ON</button>
        <button class="toggle-btn blue active" id="btn-wshadow-off" onclick="setWallShadow(false)">OFF</button>
      </div>
      <button class="menu-item-btn" onclick="selectControl('wjoy')">DIRECTION (方向と距離)<span>🕹️</span></button>
      <button class="menu-item-btn" onclick="selectControl('wsh-op')">OPACITY (濃さ)<span id="badge-wsh-op">50%</span></button>
    </div>

    <!-- 背景調整タブ -->
    <div class="tab-content" id="tab-content-bg">
      <div class="menu-section-title">BACKGROUND (背景の調整)</div>
      <button class="menu-item-btn" onclick="selectControl('bg-zoom')">🔍 ZOOM (倍率)<span id="badge-bg-zoom">1.0x</span></button>
      <button class="menu-item-btn" onclick="selectControl('bg-blur')">💧 BLUR (被写界深度)<span id="badge-bg-blur">0px</span></button>
      <button class="menu-item-btn" onclick="selectControl('bg-bright')">☀️ BRIGHT (明るさ)<span id="badge-bg-bright">100%</span></button>
      
      <div class="menu-section-title" style="color: #d580ff; margin-top: 15px;">GLOBAL LIGHTING (光と影の全同期)</div>
      <button class="menu-item-btn purple-item" onclick="selectControl('gjoy')">🌍 DIRECTION & SYNC (全連動)<span>🕹️</span></button>
    </div>

  </div>
</div>

<canvas id="capture-canvas"></canvas>

<script>
  const video = document.getElementById('camera-preview');
  const bgImg = document.getElementById('bg-image-preview');
  const bgColorPreview = document.getElementById('bg-color-preview');
  const overlayContainer = document.getElementById('overlay-container');
  const mainWrapper = document.getElementById('main-wrapper');
  const mainImg = document.getElementById('main-overlay-img');
  const lightOverlay = document.getElementById('lighting-overlay');
  const bgLightOverlay = document.getElementById('bg-lighting-overlay');
  
  // 影用レイヤー
  const floorImg = document.getElementById('floor-shadow-img');
  const wallShadowImg = document.getElementById('wall-shadow-img');
  
  const fileInput = document.getElementById('image-loader');
  const bgInput = document.getElementById('bg-loader');
  const colorPicker = document.getElementById('color-picker');
  const touchLayer = document.getElementById('touch-layer');

  let cameraStream = null;

  let state = {
    bgMode: 'camera', bgColor: '#00ff00', editTarget: 'oshi',
    bgZoom: 1.0, bgX: 0, bgY: 0, bgBlur: 0, bgBright: 100,
    size: 100, rotZ: 0, bright: 100, oshiX: 0, oshiY: 0,
    lighting: false, lightJoyX: 18, lightJoyY: -18, lightSoftness: 50,
    wallShadow: false, wallShadowOp: 50, wallShadowX: 15, wallShadowY: 15,
    floorShadow: false, floorShadowOp: 60, floorShadowBlur: 5, floorShadowJoyX: -18, floorShadowJoyY: 18,
    globalLightActive: false, globalLightX: 18, globalLightY: -18
  };

  let activeMode = 'size';

  const configs = {
    'bg-zoom':    { name: 'BG ZOOM', min: 10, max: 40, step: 1, unit: 'x', div: 10, get: () => state.bgZoom * 10, set: v => state.bgZoom = v / 10 },
    'bg-blur':    { name: 'BG BLUR', min: 0, max: 30, step: 1, unit: 'px', div: 1, get: () => state.bgBlur, set: v => state.bgBlur = v },
    'bg-bright':  { name: 'BG BRIGHT', min: 0, max: 200, step: 1, unit: '%', div: 1, get: () => state.bgBright, set: v => state.bgBright = v },
    'size':       { name: 'OSHI SIZE', min: 10, max: 250, step: 1, unit: '%', div: 1, get: () => state.size, set: v => state.size = v },
    'rot':        { name: 'ANGLE', min: -180, max: 180, step: 1, unit: '°', div: 1, get: () => state.rotZ, set: v => state.rotZ = v },
    'bright':     { name: 'BASE BRIGHT', min: 0, max: 200, step: 1, unit: '%', div: 1, get: () => state.bright, set: v => state.bright = v },
    'light-soft': { name: 'LIGHT SOFT', min: 10, max: 100, step: 1, unit: '%', div: 1, get: () => state.lightSoftness, set: v => state.lightSoftness = v },
    'fsh-blur':   { name: 'FLOOR BLUR', min: 0, max: 40, step: 1, unit: 'px', div: 1, get: () => state.floorShadowBlur, set: v => state.floorShadowBlur = v },
    'fsh-op':     { name: 'FLOOR OPAC', min: 0, max: 100, step: 1, unit: '%', div: 1, get: () => state.floorShadowOp, set: v => state.floorShadowOp = v },
    'wsh-op':     { name: 'WALL OPAC', min: 0, max: 100, step: 1, unit: '%', div: 1, get: () => state.wallShadowOp, set: v => state.wallShadowOp = v }
  };

  function toggleMenu() { document.getElementById('side-menu').classList.toggle('is-open'); }

  function switchTab(target) {
    state.editTarget = target;
    document.getElementById('tab-btn-oshi').classList.toggle('active', target === 'oshi');
    document.getElementById('tab-btn-bg').classList.toggle('active', target === 'bg');
    document.getElementById('tab-content-oshi').classList.toggle('is-active', target === 'oshi');
    document.getElementById('tab-content-bg').classList.toggle('is-active', target === 'bg');
    selectControl(target === 'oshi' ? 'size' : 'bg-zoom', true);
  }

  function setBgMode(mode) {
    state.bgMode = mode;
    const btnCam = document.getElementById('btn-bg-cam'), btnImg = document.getElementById('btn-bg-img'), btnCol = document.getElementById('btn-bg-col');
    const chooseBg = document.getElementById('btn-choose-bg'), chooseCol = document.getElementById('btn-choose-col');

    btnCam.classList.toggle('active', mode === 'camera');
    btnImg.classList.toggle('active', mode === 'image');
    btnCol.classList.toggle('active', mode === 'color');

    chooseBg.style.display = mode === 'image' ? 'block' : 'none';
    chooseCol.style.display = mode === 'color' ? 'block' : 'none';

    if (mode === 'camera') {
      bgImg.style.display = 'none'; bgColorPreview.style.display = 'none'; video.style.display = 'block'; startCamera();
    } else if (mode === 'image') {
      video.style.display = 'none'; bgColorPreview.style.display = 'none'; bgImg.style.display = 'block'; stopCamera();
      if (!bgImg.src || bgImg.src === window.location.href) bgInput.click();
    } else {
      video.style.display = 'none'; bgImg.style.display = 'none'; bgColorPreview.style.display = 'block'; stopCamera();
    }
    updateStyles();
  }

  bgInput.addEventListener('change', (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader(); reader.onload = (event) => { bgImg.src = event.target.result; updateStyles(); }; reader.readAsDataURL(file);
  });

  colorPicker.addEventListener('input', (e) => {
    state.bgColor = e.target.value; bgColorPreview.style.backgroundColor = state.bgColor;
  });

  function selectControl(mode, keepMenuOpen = false) {
    if (!keepMenuOpen) document.getElementById('side-menu').classList.remove('is-open');
    activeMode = mode;

    const qPanel = document.getElementById('quick-panel'), qJoy = document.getElementById('quick-joy'), qKnob = document.getElementById('quick-joy-knob');
    if (['wjoy','fjoy','ljoy','gjoy'].includes(mode)) {
      qPanel.classList.remove('is-active'); qJoy.classList.add('is-active');
      qJoy.className = 'quick-joystick-wrap is-active'; qKnob.className = 'quick-joystick-knob';

      if (mode === 'fjoy') {
        qJoy.classList.add('pink-theme'); qKnob.classList.add('pink-theme'); qKnob.style.transform = `translate(${state.floorShadowJoyX}px, ${state.floorShadowJoyY}px)`;
      } else if (mode === 'ljoy') {
        qJoy.classList.add('yellow-theme'); qKnob.classList.add('yellow-theme'); qKnob.style.transform = `translate(${state.lightJoyX}px, ${state.lightJoyY}px)`;
      } else if (mode === 'gjoy') {
        qJoy.classList.add('purple-theme'); qKnob.classList.add('purple-theme'); qKnob.style.transform = `translate(${state.globalLightX}px, ${state.globalLightY}px)`;
      } else {
        qKnob.style.transform = `translate(${state.wallShadowX / 1.5}px, ${state.wallShadowY / 1.5}px)`;
      }
    } else {
      qJoy.classList.remove('is-active'); qPanel.classList.add('is-active');
      const conf = configs[mode]; document.getElementById('quick-label-name').textContent = conf.name;
      const slider = document.getElementById('quick-slider'); slider.min = conf.min; slider.max = conf.max; slider.step = conf.step; slider.value = conf.get();
      updateQuickDisplay();
    }
  }

  function updateQuickDisplay() {
    const conf = configs[activeMode]; if (!conf) return;
    const val = conf.div === 10 ? (conf.get() / 10).toFixed(1) : conf.get();
    document.getElementById('quick-val-text').textContent = val + conf.unit;
    const badge = document.getElementById(`badge-${activeMode}`); if (badge) badge.textContent = val + conf.unit;
  }

  document.getElementById('quick-slider').addEventListener('input', (e) => {
    const conf = configs[activeMode]; if (!conf) return; conf.set(parseFloat(e.target.value)); updateQuickDisplay(); updateStyles();
  });

  async function startCamera() {
    if (cameraStream) return;
    try { cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false }); video.srcObject = cameraStream; } catch (err) { alert("カメラ起動失敗: " + err.message); }
  }
  function stopCamera() { if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; video.srcObject = null; } }

  window.addEventListener('load', () => { startCamera(); });

  // ★画像読み込み時に【完全な黒のシルエット画像】を生成してバグを根絶する！
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      const tempImg = new Image();
      tempImg.onload = () => {
        mainImg.src = tempImg.src;

        // 【最強のバグ回避策】Canvasで推しの形をした「真っ黒な画像」を生成する！
        const shadowCanvas = document.createElement('canvas');
        shadowCanvas.width = tempImg.naturalWidth;
        shadowCanvas.height = tempImg.naturalHeight;
        const sCtx = shadowCanvas.getContext('2d');
        sCtx.drawImage(tempImg, 0, 0);
        sCtx.globalCompositeOperation = 'source-in'; // 画像の不透明部分だけを残す
        sCtx.fillStyle = '#000000'; // 真っ黒で塗りつぶす
        sCtx.fillRect(0, 0, shadowCanvas.width, shadowCanvas.height);

        // 生成した純黒画像を影専用レイヤーにセット
        const shadowSrc = shadowCanvas.toDataURL('image/png');
        floorImg.src = shadowSrc;
        wallShadowImg.src = shadowSrc;

        overlayContainer.style.display = 'block';
        document.getElementById('studio-controls').style.display = 'flex';
        
        const initW = window.innerWidth * 0.45; 
        overlayContainer.style.width = initW + 'px';
        overlayContainer.style.height = (tempImg.naturalHeight * (initW / tempImg.naturalWidth)) + 'px';
        
        state.oshiX = window.innerWidth / 2; state.oshiY = window.innerHeight / 2;
        
        mainWrapper.style.webkitMaskImage = `url(${mainImg.src})`;
        mainWrapper.style.webkitMaskSize = '100% 100%';
        mainWrapper.style.maskImage = `url(${mainImg.src})`;
        mainWrapper.style.maskSize = '100% 100%';

        switchTab('oshi'); updateStyles();
      };
      tempImg.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });

  function updateStyles() {
    const bgTransform = `translate(calc(-50% + ${state.bgX}px), calc(-50% + ${state.bgY}px)) scale(${state.bgZoom})`;
    const bgFilter = `brightness(${state.bgBright}%) blur(${state.bgBlur}px)`;
    video.style.transform = bgTransform; video.style.filter = bgFilter;
    bgImg.style.transform = bgTransform; bgImg.style.filter = bgFilter;
    bgColorPreview.style.backgroundColor = state.bgColor;

    if (state.globalLightActive) {
      bgLightOverlay.style.opacity = 1;
      const angleRad = Math.atan2(state.globalLightY, state.globalLightX); const angleDeg = (angleRad * 180 / Math.PI) + 90;
      const dist = Math.min(1, Math.sqrt(state.globalLightX**2 + state.globalLightY**2) / 26);
      bgLightOverlay.style.background = `linear-gradient(${angleDeg}deg, rgba(255,255,255,${dist*0.4}) 0%, rgba(0,0,0,0) 50%, rgba(0,0,0,${dist*0.5}) 100%)`;
    } else {
      bgLightOverlay.style.opacity = 0;
    }

    overlayContainer.style.left = state.oshiX + 'px'; overlayContainer.style.top = state.oshiY + 'px';
    overlayContainer.style.transform = `translate(-50%, -50%) rotateZ(${state.rotZ}deg) scale(${state.size / 100})`;
    
    mainImg.style.filter = `brightness(${state.bright}%)`;
    
    // ★壁影：CSSのbrightness(0)を削除！すでに真っ黒な画像なのでOpacityとBlurだけでOK
    if (state.wallShadow) {
      wallShadowImg.style.display = 'block';
      const blur = Math.sqrt(state.wallShadowX**2 + state.wallShadowY**2) * 0.8;
      wallShadowImg.style.transform = `translate(${state.wallShadowX}px, ${state.wallShadowY}px)`;
      wallShadowImg.style.filter = `blur(${blur}px)`;
      wallShadowImg.style.opacity = state.wallShadowOp / 100;
    } else {
      wallShadowImg.style.display = 'none';
    }

    // ★床影：CSSのbrightness(0)を削除！
    if (state.floorShadow) {
      floorImg.style.display = 'block';
      const lenScale = (state.floorShadowJoyY / 26) * 1.5; const skewDeg = (state.floorShadowJoyX / 26) * 60;
      floorImg.style.transform = `skewX(${skewDeg}deg) scaleY(${lenScale})`;
      floorImg.style.filter = `blur(${state.floorShadowBlur}px)`;
      floorImg.style.opacity = state.floorShadowOp / 100;
    } else {
      floorImg.style.display = 'none';
    }

    if (state.lighting) {
      lightOverlay.style.opacity = 1;
      const angleRad = Math.atan2(state.lightJoyY, state.lightJoyX); const angleDeg = (angleRad * 180 / Math.PI) + 90;
      const dist = Math.sqrt(state.lightJoyX**2 + state.lightJoyY**2); const intensity = Math.min(1, dist / 26);
      const whiteStop = Math.max(10, 60 - (state.lightSoftness * 0.5)); const blackStop = Math.min(95, 40 + (state.lightSoftness * 0.5));
      lightOverlay.style.background = `linear-gradient(${angleDeg}deg, rgba(255,255,255,${intensity * 0.9}) 0%, rgba(255,255,255,${intensity * 0.4}) ${whiteStop}%, rgba(0,0,0,0) 50%, rgba(0,0,0,${intensity * 0.5}) ${blackStop}%, rgba(0,0,0,${intensity * 0.9}) 100%)`;
    } else {
      lightOverlay.style.opacity = 0;
    }
  }

  function setLighting(on) { state.lighting = on; document.getElementById('btn-light-on').classList.toggle('active', on); document.getElementById('btn-light-off').classList.toggle('active', !on); updateStyles(); }
  function setWallShadow(on) { state.wallShadow = on; document.getElementById('btn-wshadow-on').classList.toggle('active', on); document.getElementById('btn-wshadow-off').classList.toggle('active', !on); updateStyles(); }
  function setFloorShadow(on) { state.floorShadow = on; document.getElementById('btn-fshadow-on').classList.toggle('active', on); document.getElementById('btn-fshadow-off').classList.toggle('active', !on); updateStyles(); }

  /* --- ジョイスティック --- */
  const qJoy = document.getElementById('quick-joy'), qKnob = document.getElementById('quick-joy-knob');
  let joyActive = false; const maxJoyR = 26;
  function handleJoy(e) {
    if (!joyActive) return; e.preventDefault(); const t = e.touches ? e.touches[0] : e; const rect = qJoy.getBoundingClientRect();
    let dx = t.clientX - (rect.left + rect.width / 2); let dy = t.clientY - (rect.top + rect.height / 2);
    const dist = Math.sqrt(dx * dx + dy * dy); if (dist > maxJoyR) { dx = (dx / dist) * maxJoyR; dy = (dy / dist) * maxJoyR; }
    qKnob.style.transform = `translate(${dx}px, ${dy}px)`;

    if (activeMode === 'gjoy') {
      state.globalLightActive = true; state.globalLightX = dx; state.globalLightY = dy;
      state.lightJoyX = dx; state.lightJoyY = dy; state.floorShadowJoyX = -dx; state.floorShadowJoyY = -dy; state.wallShadowX = -dx * 1.5; state.wallShadowY = -dy * 1.5;
      if(!state.lighting) setLighting(true); if(!state.floorShadow) setFloorShadow(true); if(!state.wallShadow) setWallShadow(true);
    } else {
      state.globalLightActive = false;
      if (activeMode === 'fjoy') { state.floorShadowJoyX = dx; state.floorShadowJoyY = dy; }
      else if (activeMode === 'ljoy') { state.lightJoyX = dx; state.lightJoyY = dy; }
      else { state.wallShadowX = dx * 1.5; state.wallShadowY = dy * 1.5; }
    }
    updateStyles();
  }
  qJoy.addEventListener('mousedown', (e) => { joyActive = true; handleJoy(e); }); window.addEventListener('mousemove', handleJoy); window.addEventListener('mouseup', () => { joyActive = false; });
  qJoy.addEventListener('touchstart', (e) => { joyActive = true; handleJoy(e); }, { passive: false }); window.addEventListener('touchmove', handleJoy, { passive: false }); window.addEventListener('touchend', () => { joyActive = false; });

  /* --- タブ連動ドラッグ移動 --- */
  let isDragging = false, startX, startY, initBgX, initBgY, initOshiX, initOshiY;
  function onDragStart(e) {
    if (e.target.closest('.bottom-bar') || e.target.closest('.side-panel') || e.target.closest('.menu-toggle-btn')) return;
    e.preventDefault(); isDragging = true; const t = e.touches ? e.touches[0] : e; startX = t.clientX; startY = t.clientY;
    if (state.editTarget === 'bg') { initBgX = state.bgX; initBgY = state.bgY; } else { initOshiX = state.oshiX; initOshiY = state.oshiY; }
  }
  function onDragMove(e) {
    if (!isDragging) return; e.preventDefault(); const t = e.touches ? e.touches[0] : e; const dx = t.clientX - startX; const dy = t.clientY - startY;
    if (state.editTarget === 'bg') { state.bgX = initBgX + dx; state.bgY = initBgY + dy; } else { state.oshiX = initOshiX + dx; state.oshiY = initOshiY + dy; } updateStyles();
  }
  function onDragEnd() { isDragging = false; }
  touchLayer.addEventListener('mousedown', onDragStart); window.addEventListener('mousemove', onDragMove); window.addEventListener('mouseup', onDragEnd);
  touchLayer.addEventListener('touchstart', onDragStart, { passive: false }); window.addEventListener('touchmove', onDragMove, { passive: false }); window.addEventListener('touchend', onDragEnd);

  /* --- キャラ＆影＆ライト Canvas描画ロジック --- */
  function drawOverlayToCtx(ctx) {
    const origW = mainImg.naturalWidth; const origH = mainImg.naturalHeight;
    ctx.rotate(state.rotZ * Math.PI / 180);
    const baseScale = parseFloat(overlayContainer.style.width) / origW;
    ctx.scale(baseScale * (state.size / 100), baseScale * (state.size / 100));

    // ★床影描画 (すでに真っ黒な画像なのでbrightness処理不要)
    if (state.floorShadow) {
      ctx.save();
      ctx.globalAlpha = state.floorShadowOp / 100;
      ctx.filter = `blur(${state.floorShadowBlur}px)`;
      ctx.translate(0, origH / 2);
      ctx.transform(1, 0, Math.tan((state.floorShadowJoyX / 26) * 60 * Math.PI / 180), (state.floorShadowJoyY / 26) * 1.5, 0, 0);
      ctx.drawImage(floorImg, -origW / 2, -origH, origW, origH);
      ctx.restore();
    }

    // ★壁影描画 (すでに真っ黒な画像)
    if (state.wallShadow) {
      ctx.save();
      ctx.globalAlpha = state.wallShadowOp / 100;
      const blur = Math.sqrt(state.wallShadowX**2 + state.wallShadowY**2) * 0.8;
      ctx.filter = `blur(${blur}px)`;
      ctx.translate(state.wallShadowX, state.wallShadowY);
      ctx.drawImage(wallShadowImg, -origW / 2, -origH / 2, origW, origH);
      ctx.restore();
    }

    const charCanvas = document.createElement('canvas');
    charCanvas.width = origW; charCanvas.height = origH;
    const cCtx = charCanvas.getContext('2d');

    cCtx.filter = `brightness(${state.bright}%)`;
    cCtx.drawImage(mainImg, 0, 0, origW, origH);

    if (state.lighting) {
      const gradCanvas = document.createElement('canvas'); gradCanvas.width = origW; gradCanvas.height = origH;
      const gCtx = gradCanvas.getContext('2d');
      
      gCtx.drawImage(mainImg, 0, 0, origW, origH);
      gCtx.globalCompositeOperation = 'source-in';
      
      const angleRad = Math.atan2(state.lightJoyY, state.lightJoyX);
      const intensity = Math.min(1, Math.sqrt(state.lightJoyX**2 + state.lightJoyY**2) / 26);
      const x1 = origW/2 - Math.cos(angleRad) * (origW / 2); const y1 = origH/2 - Math.sin(angleRad) * (origH / 2);
      const x2 = origW/2 + Math.cos(angleRad) * (origW / 2); const y2 = origH/2 + Math.sin(angleRad) * (origH / 2);

      const grad = gCtx.createLinearGradient(x1, y1, x2, y2);
      const whiteStop = Math.max(0.1, 0.6 - (state.lightSoftness * 0.005)); const blackStop = Math.min(0.95, 0.4 + (state.lightSoftness * 0.005));

      grad.addColorStop(0, `rgba(255, 255, 255, ${intensity * 0.9})`);
      grad.addColorStop(whiteStop, `rgba(255, 255, 255, ${intensity * 0.4})`);
      grad.addColorStop(0.5, `rgba(0, 0, 0, 0)`);
      grad.addColorStop(blackStop, `rgba(0, 0, 0, ${intensity * 0.5})`);
      grad.addColorStop(1, `rgba(0, 0, 0, ${intensity * 0.9})`);

      gCtx.fillStyle = grad; gCtx.fillRect(0, 0, origW, origH);

      cCtx.globalCompositeOperation = 'hard-light'; cCtx.drawImage(gradCanvas, 0, 0, origW, origH);
    }
    ctx.drawImage(charCanvas, -origW / 2, -origH / 2, origW, origH);
  }

  /* --- 撮影＆保存 --- */
  async function takePhoto() {
    if (!mainImg.src || overlayContainer.style.display === 'none') { alert("まずは推し画像を読み込んでね！"); return; }
    if (state.bgMode === 'image' && (!bgImg.src || bgImg.src === window.location.href)) { alert("背景画像を選択してね！"); return; }

    const flash = document.getElementById('flash'); flash.style.opacity = 1; setTimeout(() => { flash.style.opacity = 0; }, 120);
    const canvas = document.getElementById('capture-canvas'); const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 2; const vw = window.innerWidth; const vh = window.innerHeight;
    canvas.width = vw * dpr; canvas.height = vh * dpr; ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';

    if (state.bgMode === 'color') {
      ctx.save(); ctx.fillStyle = state.bgColor; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.restore();
    } else {
      const source = state.bgMode === 'camera' ? video : bgImg;
      const srcW = state.bgMode === 'camera' ? video.videoWidth : bgImg.naturalWidth; const srcH = state.bgMode === 'camera' ? video.videoHeight : bgImg.naturalHeight;
      const sRatio = vw / vh; const srcRatio = srcW / srcH; let dW, dH; if (srcRatio > sRatio) { dH = vh; dW = vh * srcRatio; } else { dW = vw; dH = vw / srcRatio; }
      ctx.save(); ctx.translate((vw * dpr) / 2 + state.bgX * dpr, (vh * dpr) / 2 + state.bgY * dpr); ctx.scale(state.bgZoom, state.bgZoom); ctx.filter = `brightness(${state.bgBright}%) blur(${state.bgBlur * dpr}px)`; ctx.drawImage(source, (-dW / 2) * dpr, (-dH / 2) * dpr, dW * dpr, dH * dpr); ctx.restore();
    }

    if (state.globalLightActive) {
      ctx.save();
      const angleRad = Math.atan2(state.globalLightY, state.globalLightX); const dist = Math.min(1, Math.sqrt(state.globalLightX**2 + state.globalLightY**2) / 26);
      const x1 = (vw * dpr)/2 - Math.cos(angleRad) * (vw * dpr)/2; const y1 = (vh * dpr)/2 - Math.sin(angleRad) * (vh * dpr)/2;
      const x2 = (vw * dpr)/2 + Math.cos(angleRad) * (vw * dpr)/2; const y2 = (vh * dpr)/2 + Math.sin(angleRad) * (vh * dpr)/2;
      const bgGrad = ctx.createLinearGradient(x1, y1, x2, y2); bgGrad.addColorStop(0, `rgba(255,255,255,${dist*0.4})`); bgGrad.addColorStop(0.5, `rgba(0,0,0,0)`); bgGrad.addColorStop(1, `rgba(0,0,0,${dist*0.5})`);
      ctx.fillStyle = bgGrad; ctx.globalCompositeOperation = 'overlay'; ctx.fillRect(0, 0, vw*dpr, vh*dpr); ctx.restore();
    }

    ctx.save(); ctx.translate(state.oshiX * dpr, state.oshiY * dpr); ctx.scale(dpr, dpr); drawOverlayToCtx(ctx); ctx.restore();

    canvas.toBlob(async (blob) => {
      const fileName = `studio_photo_${Date.now()}.jpg`; const file = new File([blob], fileName, { type: 'image/jpeg' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: 'AR撮影写真' }); } catch (err) { if (err.name !== 'AbortError') alert("保存に失敗しました: " + err.message); } } else { const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = fileName; link.click(); }
    }, 'image/jpeg', 0.95);
  }
</script>
</body>
</html>
